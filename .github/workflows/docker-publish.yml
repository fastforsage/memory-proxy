name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (the same pins as the image)
        run: pip install -r requirements.txt pytest pyflakes
      - name: Lint (pyflakes)
        run: pyflakes proxy.py manage.py download_model.py tests/
      - name: Unit + HTTP integration tests (ONNX stubbed)
        run: pytest -q tests/

  docker:
    # Образ собирается и проверяется на каждом push, но публикуется только по тегу v*
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: fastforsage/memory-proxy
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=short
          flavor: |
            latest=auto

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: memory-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (real model, /health, Host check, auth)
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name mp -p 127.0.0.1:8081:8081 -v "$PWD/data:/data" \
            -e API_KEY=ci-secret memory-proxy:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/health && break
            sleep 2
          done
          curl -fsS http://localhost:8081/health | grep -q '"status":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:8081/health)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-secret' \
                 -H 'Content-Type: text/plain' -d '{}' http://localhost:8081/v1/chat/completions)" = 415
          # Команды памяти отвечают без LLM
          curl -fsS -H 'Authorization: Bearer ci-secret' -H 'Content-Type: application/json' \
               -H 'X-OpenWebUI-User-Id: ci-user' \
               -d '{"messages":[{"role":"user","content":"/facts"}]}' \
               http://localhost:8081/v1/chat/completions | grep -q 'ci-user'
          # manage.py есть в образе и видит базу
          docker exec mp python manage.py stats
          docker logs mp

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
